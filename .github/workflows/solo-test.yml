name: solo-test

on:
  workflow_dispatch:
    inputs:
      BOT_SCRIPT:
        description: Bot script
        required: true
        default: ck47.py
      TRANSFER_DEST_ID:
        description: Transfer destination ID
        required: false
        default: "71391343"

permissions:
  contents: read
  actions: write

jobs:
  run-single:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: solo-test-${{ github.event.inputs.BOT_SCRIPT }}
      cancel-in-progress: true
    env:
      BOT_SCRIPT: ${{ github.event.inputs.BOT_SCRIPT }}
      TRANSFER_DEST_ID: ${{ github.event.inputs.TRANSFER_DEST_ID || '71391343' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright websocket-client
          playwright install chromium --with-deps

      - name: Run single bot
        env:
          HEADLESS: 'true'
          COOLDOWN: '3'
          REST_BETWEEN_RUNS: '5'
          MAX_RUNTIME: '1200'
          TRANSFER_ENABLED: 'true'
          PRE_CLAIM_TRANSFER_THRESHOLD: '50000'
          SESSION_START_JITTER: '10'
        run: |
          mkdir -p /tmp/bot_logs
          name="${BOT_SCRIPT%.py}"
          LOG="/tmp/bot_logs/${name}.log"
          echo "[$(date '+%H:%M:%S')] Starting $BOT_SCRIPT on $(grep 'SINGLE_COOKIE_FILE' $BOT_SCRIPT | head -1)"
          START=$(date +%s)
          python3 "$BOT_SCRIPT" 2>&1 | tee "$LOG"
          EXIT=${PIPESTATUS[0]}
          DUR=$(( $(date +%s) - START ))
          echo "[$(date '+%H:%M:%S')] exit=$EXIT after ${DUR}s"
          echo "=== Final 30 lines ==="
          tail -30 "$LOG"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solo-test-log
          path: /tmp/bot_logs/
          retention-days: 1
