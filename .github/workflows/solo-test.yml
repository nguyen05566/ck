name: solo-test

on:
  workflow_dispatch:
    inputs:
      BOT_SCRIPT:
        description: Bot script
        required: true
        default: ck56.py
      TRANSFER_DEST_ID:
        description: Transfer destination ID
        required: false
        default: "71391343"
      MAX_RUNTIME:
        description: Max runtime seconds
        required: false
        default: "1200"

permissions:
  contents: read
  actions: write

jobs:
  run-single:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: solo-test-${{ github.event.inputs.BOT_SCRIPT }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install playwright websocket-client
          playwright install chromium --with-deps
      - name: Run single bot
        env:
          TRANSFER_DEST_ID: ${{ github.event.inputs.TRANSFER_DEST_ID || '71391343' }}
          MAX_RUNTIME: ${{ github.event.inputs.MAX_RUNTIME || '1200' }}
          HEADLESS: 'true'
          COOLDOWN: '3'
          REST_BETWEEN_RUNS: '5'
          TRANSFER_ENABLED: 'true'
          PRE_CLAIM_TRANSFER_THRESHOLD: '50000'
          SESSION_START_JITTER: '10'
          MAX_CLAIMS_PER_DAY: '0'
          MAX_TRANSFERS_PER_DAY: '0'
        run: |
          mkdir -p /tmp/bot_logs
          name="${{ github.event.inputs.BOT_SCRIPT }}"
          name="${name%.py}"
          LOG="/tmp/bot_logs/${name}.log"
          echo "[$(date '+%H:%M:%S')] Starting ${{ github.event.inputs.BOT_SCRIPT }}"
          python3 "${{ github.event.inputs.BOT_SCRIPT }}" 2>&1 | tee "$LOG"
          echo "[$(date '+%H:%M:%S')] exit=${PIPESTATUS[0]}"
          echo "=== Final log tail ==="
          tail -30 "$LOG"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solo-test-log
          path: /tmp/bot_logs/
          retention-days: 1
