name: d-tienlen_miennam

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright websocket-client psutil requests
          playwright install chromium --with-deps

      - name: Setup Cloudflare WARP (1.1.1.1)
        run: |
          set +e
          echo "=== Setup WARP (wgcf + WireGuard) ==="
          cd /tmp
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard
          curl -fsSL -o /tmp/wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.22/wgcf_2.2.22_linux_amd64
          chmod +x /tmp/wgcf
          /tmp/wgcf register --accept-tos
          /tmp/wgcf generate
          # wgcf generate thanh cong -> wgcf-profile.conf o CWD (/tmp)
          # Bo DNS= de tranh wg-quick fail vi thieu resolvconf tren runner
          sed -i '/^DNS=/d' /tmp/wgcf-profile.conf
          sudo cp /tmp/wgcf-profile.conf /etc/wireguard/warp.conf
          if sudo wg-quick up warp; then
            sleep 3
            echo "=== Verify WARP ==="
            curl -s --max-time 15 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|warp|loc)=' || echo "WARN: khong trace duoc"
            echo "WARP_STATUS=up"
          else
            echo "WARN: wg-quick up that bai — bot van chay direct"
            echo "WARP_STATUS=direct"
          fi
          cd "$GITHUB_WORKSPACE"

      - name: Run d-tienlen_miennam
        env:
          MAX_CLAIMS: '40'
          HEADLESS: 'true'
          COOLDOWN: '3'
          REST_BETWEEN_RUNS: '5'
          MAX_RUNTIME: '21000'
          TRANSFER_DEST_ID: '71746784'
          TRANSFER_ENABLED: 'true'
          PRE_CLAIM_TRANSFER_THRESHOLD: '50000'
          MAX_CLAIMS_PER_DAY: '120'
          MAX_TRANSFERS_PER_DAY: '20'
          SESSION_START_JITTER: '180'
          IDLE_EVERY_CLAIMS: '40'
          SINGLE_COOKIE_FILE: 'd.txt'
          GAME_URL: 'https://www.facebook.com/gaming/play/tienlen_miennam'
        run: |
          set +e
          END_TIME=$(( $(date +%s) + ${MAX_RUNTIME} ))
          ATTEMPT=0
          while [ $(date +%s) -lt $END_TIME ]; do
            ATTEMPT=$((ATTEMPT+1))
            REMAIN=$(( END_TIME - $(date +%s) ))
            echo "=== [d-tienlen_miennam] Attempt #$ATTEMPT — ${REMAIN}s left ==="
            python3 -u d-tienlen_miennam.py
            EXIT=$?
            echo "=== [d-tienlen_miennam] exit=$EXIT ==="
            REMAIN=$(( END_TIME - $(date +%s) ))
            if [ $REMAIN -le 30 ]; then
              break
            fi
            echo "[d-tienlen_miennam] Sleeping 60s..."
            sleep 60
          done
