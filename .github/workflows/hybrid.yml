name: hybrid-parallel

# ============================================================
# HYBRID PARALLELISM — gộp 44 bot ck*.py thành 10 job matrix
# ============================================================
# - Mức 1 (matrix): 10 group song song, GitHub Actions tự sinh 10 runner
# - Mức 2 (process): trong mỗi group, 4-5 bot chạy đồng thời bằng bash `&` + `wait`
#
# Tổng bot: 44 (ck1-ck46, bỏ ck11 và ck22 vì không tồn tại)
# Trước đây: 44 workflow × 5h50m = ~257h Actions/run
# Sau gộp:   10 job      × 5h50m = ~58h Actions/run  → tiết kiệm ~80%
#
# GitHub-hosted ubuntu-latest runner: 4 vCPU / 16 GB RAM / 14 GB SSD
# → mỗi job chạy 4-5 Chromium headless (~1-1.5 GB mỗi con) hoàn toàn thoải mái.
#
# anti_lock.py v3 đã sharding state per-bot (state/<ck>.state.json,
# fingerprints/<ck>.fp.json) → không tranh chấp khi chạy song song.
# ============================================================

on:
  workflow_dispatch:
  schedule:
    # Cron mỗi 6h làm trigger dự phòng
    - cron: '0 */6 * * *'

permissions:
  actions: write
  contents: read

# (Concurrency được set ở job-level để có quyền truy cập matrix.group)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Mỗi group có concurrency group riêng -> cron tiếp theo xếp hàng chờ,
    # không huỷ phiên đang chạy (cancel-in-progress: false)
    concurrency:
      group: hybrid-${{ matrix.group }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - group: g1
            bots: "ck1.py ck2.py ck3.py ck4.py ck5.py"
            bot_count: 5
          - group: g2
            bots: "ck6.py ck7.py ck8.py ck9.py ck10.py"
            bot_count: 5
          - group: g3
            bots: "ck12.py ck13.py ck14.py ck15.py ck16.py"
            bot_count: 5
          - group: g4
            bots: "ck17.py ck18.py ck19.py ck20.py ck21.py"
            bot_count: 5
          - group: g5
            bots: "ck23.py ck24.py ck25.py ck26.py"
            bot_count: 4
          - group: g6
            bots: "ck27.py ck28.py ck29.py ck30.py"
            bot_count: 4
          - group: g7
            bots: "ck31.py ck32.py ck33.py ck34.py"
            bot_count: 4
          - group: g8
            bots: "ck35.py ck36.py ck37.py ck38.py"
            bot_count: 4
          - group: g9
            bots: "ck39.py ck40.py ck41.py ck42.py"
            bot_count: 4
          - group: g10
            bots: "ck43.py ck44.py ck45.py ck46.py"
            bot_count: 4

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright websocket-client
          playwright install chromium --with-deps

      - name: Print group info
        run: |
          echo "=== Group: ${{ matrix.group }} ==="
          echo "Bots (${{ matrix.bot_count }}): ${{ matrix.bots }}"
          echo "Runner: $(nproc) vCPU, $(free -g | awk '/^Mem/' | awk '{print $2}') GB RAM"
          df -h /

      - name: Run bots in parallel (Hybrid Parallelism)
        env:
          MAX_CLAIMS: '40'
          HEADLESS: 'true'
          COOLDOWN: '3'
          REST_BETWEEN_RUNS: '5'
          MAX_RUNTIME: '21000'
          TRANSFER_DEST_ID: '66978075'
          TRANSFER_ENABLED: 'true'
          PRE_CLAIM_TRANSFER_THRESHOLD: '50000'
          MAX_CLAIMS_PER_DAY: '120'
          MAX_TRANSFERS_PER_DAY: '20'
          SESSION_START_JITTER: '180'
          IDLE_EVERY_CLAIMS: '40'
          GROUP_BOTS: ${{ matrix.bots }}
        run: |
          set +e
          mkdir -p /tmp/bot_logs

          run_bot() {
            local bot="$1"
            local name="${bot%.py}"
            local LOG="/tmp/bot_logs/${name}.log"

            (
              END_TIME=$(( $(date +%s) + ${MAX_RUNTIME} ))
              ATTEMPT=0
              while [ $(date +%s) -lt $END_TIME ]; do
                ATTEMPT=$((ATTEMPT+1))
                REMAIN=$(( END_TIME - $(date +%s) ))
                echo "=== [$name] [$(date '+%H:%M:%S')] Attempt #$ATTEMPT — ${REMAIN}s left ==="
                START=$(date +%s)
                python3 "$bot"
                EXIT=$?
                DUR=$(( $(date +%s) - START ))
                echo "=== [$name] [$(date '+%H:%M:%S')] exit=$EXIT after ${DUR}s ==="
                REMAIN=$(( END_TIME - $(date +%s) ))
                if [ $REMAIN -le 30 ]; then
                  echo "[$name] Time up — stopping retry loop."
                  break
                fi
                echo "[$name] Sleeping 60s before retry..."
                sleep 60
              done
            ) > "$LOG" 2>&1
          }

          PIDS=()
          for bot in $GROUP_BOTS; do
            name="${bot%.py}"
            echo "[$(date '+%H:%M:%S')] Starting $bot -> /tmp/bot_logs/${name}.log"
            run_bot "$bot" &
            PIDS+=($!)
            # Stagger 10-15s giữa các launch để tránh 5 browser bung RAM cùng lúc
            sleep $((RANDOM % 6 + 10))
          done

          echo ""
          echo "=== All ${#PIDS[@]} bots of group ${{ matrix.group }} launched. ==="
          echo "PIDs: ${PIDS[*]}"
          echo ""

          FAILED=0
          for pid in "${PIDS[@]}"; do
            wait $pid
            STATUS=$?
            echo "[$(date '+%H:%M:%S')] PID $pid exited status=$STATUS"
            [ $STATUS -ne 0 ] && FAILED=$((FAILED+1))
          done

          echo ""
          echo "=== Group ${{ matrix.group }} done — $FAILED/${#PIDS[@]} failed ==="
          # Luôn exit 0 để 1 bot fail không huỷ cả job → log/artifact vẫn upload được
          exit 0

      - name: Show all bot logs (tail 300 lines each)
        if: always()
        run: |
          for f in /tmp/bot_logs/*.log; do
            [ -f "$f" ] || continue
            echo ""
            echo "============================================================"
            echo "=== $f ==="
            echo "============================================================"
            tail -300 "$f" 2>/dev/null || echo "(empty)"
          done

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-shots-${{ matrix.group }}
          path: /tmp/debug_*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload all bot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs-${{ matrix.group }}
          path: /tmp/bot_logs/*.log
          if-no-files-found: warn
          retention-days: 7
