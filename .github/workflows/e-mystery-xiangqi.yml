name: e-mystery-xiangqi

on:
  workflow_dispatch:
    inputs:
      TRANSFER_DEST_ID:
        description: "Transfer destination ID"
        required: false
        default: "71961649"

permissions:
  actions: write
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright websocket-client psutil requests
          playwright install chromium --with-deps

      - name: Run e-mystery-xiangqi
        env:
          MAX_CLAIMS: '40'
          HEADLESS: 'true'
          COOLDOWN: '3'
          REST_BETWEEN_RUNS: '5'
          MAX_RUNTIME: '21000'
          TRANSFER_DEST_ID: ${{ github.event.inputs.TRANSFER_DEST_ID || '71961649' }}
          TRANSFER_ENABLED: 'true'
          PRE_CLAIM_TRANSFER_THRESHOLD: '50000'
          MAX_CLAIMS_PER_DAY: '0'
          MAX_TRANSFERS_PER_DAY: '0'
          SESSION_START_JITTER: '180'
          IDLE_EVERY_CLAIMS: '40'
          SINGLE_COOKIE_FILE: 'e.txt'
          GAME_URL: 'https://www.facebook.com/gaming/play/mystery-xiangqi'
        run: |
          set +e
          END_TIME=$(( $(date +%s) + ${MAX_RUNTIME} ))
          ATTEMPT=0
          while [ $(date +%s) -lt $END_TIME ]; do
            ATTEMPT=$((ATTEMPT+1))
            REMAIN=$(( END_TIME - $(date +%s) ))
            echo "=== [e-mystery-xiangqi] Attempt #$ATTEMPT — ${REMAIN}s left ==="
            python3 -u e-mystery-xiangqi.py
            EXIT=$?
            echo "=== [e-mystery-xiangqi] exit=$EXIT ==="
            REMAIN=$(( END_TIME - $(date +%s) ))
            if [ $REMAIN -le 30 ]; then
              break
            fi
            echo "[e-mystery-xiangqi] Sleeping 60s..."
            sleep 60
          done
