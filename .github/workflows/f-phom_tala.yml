name: f-phom_tala

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright websocket-client psutil requests
          playwright install chromium --with-deps

      - name: Recheck WARP IP (phải khớp start — không đổi giữa phiên)
        run: |
          if [ -f /tmp/warp_ip_session.txt ]; then
            IP1=$(cat /tmp/warp_ip_session.txt)
            IP2=$(curl -s --max-time 15 https://www.cloudflare.com/cdn-cgi/trace | awk -F= '/^ip=/{print $2}')
            echo "session_start=${IP1} now=${IP2}"
            if [ -n "$IP1" ] && [ "$IP1" != "$IP2" ]; then
              echo "WARN: IP đổi giữa phiên ${IP1} -> ${IP2} — thử up lại warp cùng account"
              sudo wg-quick down warp 2>/dev/null || true
              sudo wg-quick up warp || true
              sleep 3
              IP3=$(curl -s --max-time 15 https://www.cloudflare.com/cdn-cgi/trace | awk -F= '/^ip=/{print $2}')
              echo "after_restart=${IP3}"
              # vẫn giữ account cũ — IP có thể về CGNAT pool, chỉ log
            fi
          else
            echo "no session ip file"
          fi

      - name: Run f-phom_tala
        env:
          MAX_CLAIMS: '40'
          HEADLESS: 'true'
          COOLDOWN: '3'
          REST_BETWEEN_RUNS: '5'
          MAX_RUNTIME: '21000'
          TRANSFER_DEST_ID: '71394079'
          TRANSFER_ENABLED: 'true'
          PRE_CLAIM_TRANSFER_THRESHOLD: '50000'
          MAX_CLAIMS_PER_DAY: '120'
          MAX_TRANSFERS_PER_DAY: '20'
          SESSION_START_JITTER: '180'
          IDLE_EVERY_CLAIMS: '40'
          SINGLE_COOKIE_FILE: 'f.txt'
          GAME_URL: 'https://www.facebook.com/gaming/play/phom_tala'
        run: |
          set +e
          END_TIME=$(( $(date +%s) + ${MAX_RUNTIME} ))
          ATTEMPT=0
          while [ $(date +%s) -lt $END_TIME ]; do
            ATTEMPT=$((ATTEMPT+1))
            REMAIN=$(( END_TIME - $(date +%s) ))
            echo "=== [f-phom_tala] Attempt #$ATTEMPT — ${REMAIN}s left ==="
            python3 -u f-phom_tala.py
            EXIT=$?
            echo "=== [f-phom_tala] exit=$EXIT ==="
            REMAIN=$(( END_TIME - $(date +%s) ))
            if [ $REMAIN -le 30 ]; then
              break
            fi
            echo "[f-phom_tala] Sleeping 60s..."
            sleep 60
          done
