name: sync-code

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (report only, true/false)'
        required: false
        default: 'true'
      template:
        description: 'Template file (auto = newest 1002-line file)'
        required: false
        default: 'auto'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Sync ck*.py to 1002-line code (keep cookies)
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          TEMPLATE: ${{ github.event.inputs.template }}
        run: python3 sync_code.py

      - name: Commit & push
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add ck*.py sync_report.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync bots to 1002-line code (preserve ck*.txt cookie refs)"
            git push
          fi
