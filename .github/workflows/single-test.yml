name: single-test

on:
  workflow_dispatch:
    inputs:
      BOT_SCRIPT:
        description: "Bot script (e.g. ck47.py)"
        required: true
        default: "ck47.py"
      TRANSFER_DEST_ID:
        description: "Transfer destination ID"
        required: false
        default: "71391343"
      MAX_RUNTIME:
        description: "Max runtime seconds (default: 1200)"
        required: false
        default: "1200"

permissions:
  contents: read
  actions: write

jobs:
  run-single-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: single-test-${{ github.event.inputs.BOT_SCRIPT }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright websocket-client
          playwright install chromium --with-deps

      - name: Run single bot
        env:
          BOT_SCRIPT: ${{ github.event.inputs.BOT_SCRIPT }}
          TRANSFER_DEST_ID: ${{ github.event.inputs.TRANSFER_DEST_ID || '71391343' }}
          MAX_RUNTIME: ${{ github.event.inputs.MAX_RUNTIME || '1200' }}
          HEADLESS: 'true'
          COOLDOWN: '3'
          REST_BETWEEN_RUNS: '5'
          TRANSFER_ENABLED: 'true'
          PRE_CLAIM_TRANSFER_THRESHOLD: '50000'
          SESSION_START_JITTER: '10'
          MAX_CLAIMS_PER_DAY: '0'
          MAX_TRANSFERS_PER_DAY: '0'
        run: |
          set -e
          mkdir -p /tmp/bot_logs
          name="${BOT_SCRIPT%.py}"
          LOG="/tmp/bot_logs/${name}.log"

          echo "=== Single Bot Test: $BOT_SCRIPT ==="
          echo "Transfer Dest: $TRANSFER_DEST_ID"
          echo "Max runtime: $MAX_RUNTIME seconds"
          echo "Cookie file: $(grep 'SINGLE_COOKIE_FILE' $BOT_SCRIPT | head -1)"

          echo "[$(date '+%H:%M:%S')] Starting $BOT_SCRIPT"
          START=$(date +%s)
          SINGLE_COOKIE_FILE="" python3 "$BOT_SCRIPT" 2>&1 | tee "$LOG"
          EXIT=${PIPESTATUS[0]}
          DUR=$(( $(date +%s) - START ))
          echo "[$(date '+%H:%M:%S')] exit=$EXIT after ${DUR}s"

          echo "=== Final log tail ==="
          tail -30 "$LOG"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: single-test-${{ github.event.inputs.BOT_SCRIPT }}
          path: /tmp/bot_logs/
          retention-days: 1
